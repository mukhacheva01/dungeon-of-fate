name: Build and deploy Web game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Web export templates
        run: |
          dest="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$dest"
          curl -L --fail --retry 3 -o /tmp/godot-templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p /tmp/godot-templates
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/godot-templates.tpz') as archive:
              archive.extractall('/tmp/godot-templates')
          PY
          cp -r /tmp/godot-templates/templates/. "$dest/"
          test -f "$dest/web_nothreads_release.zip"

      - name: Import project
        run: godot --headless --path . --editor --import

      - name: Run combat regression tests
        run: godot --headless --path . --script tests/test_combat.gd

      - name: Run real-time regression tests
        run: godot --headless --path . --script tests/test_action.gd --quit-after 300

      - name: Export Web build
        run: |
          mkdir -p build
          godot --headless --path . --export-release Web build/index.html
          test -s build/index.html
          ls -lh build

      - name: Upload Web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
