name: Build and deploy Web game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and Web templates
        uses: firebelley/setup-godot@v2
        with:
          version: 4.7.2
          include-templates: true

      - name: Import project
        run: godot --headless --path . --editor --import

      - name: Run combat regression tests
        run: godot --headless --path . --script tests/test_combat.gd

      - name: Run real-time regression tests
        run: godot --headless --path . --script tests/test_action.gd --quit-after 300

      - name: Export Web build
        run: |
          mkdir -p build
          godot --headless --path . --export-release Web build/index.html
          test -s build/index.html
          ls -lh build

      - name: Upload Web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
